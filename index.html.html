<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campo de girasoles</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
body{position:relative;background:linear-gradient(#8ed8ff 0 58%,#73c94b 58%)}
.sky{position:absolute;inset:0;background:
radial-gradient(circle at 78% 16%,#fff7 0 6%,transparent 7%),
radial-gradient(circle at 18% 25%,#fff8 0 5%,transparent 6%)}
#field{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.start{
position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);
padding:18px 30px;border:0;border-radius:999px;background:#f7c928;color:#503600;
font-size:22px;font-weight:800;box-shadow:0 8px 25px #0003;cursor:pointer
}
.start:active{transform:translate(-50%,-50%) scale(.96)}
.sunflower{
position:absolute;font-size:42px;animation:grow .45s ease-out both;
filter:drop-shadow(0 3px 2px #0002);user-select:none
}
@keyframes grow{from{transform:scale(0) rotate(-20deg);opacity:0}
to{transform:scale(1) rotate(0);opacity:1}}
.hint{position:absolute;bottom:22px;width:100%;text-align:center;color:#fff;
font-weight:600;text-shadow:0 2px 4px #0006}
</style>
</head>
<body>
<div class="sky"></div>
<div id="field"></div>
<button class="start" id="btn">Presione aquí 🌻</button>
<div class="hint">Toca el botón para llenar la pantalla de girasoles</div>
<script>
const field=document.getElementById('field'),btn=document.getElementById('btn');
function bloom(){
  for(let i=0;i<70;i++){
    const s=document.createElement('span');
    s.className='sunflower';
    s.textContent='🌻';
    s.style.left=(Math.random()*100)+'%';
    s.style.top=(Math.random()*100)+'%';
    s.style.fontSize=(26+Math.random()*42)+'px';
    s.style.animationDelay=(Math.random()*.5)+'s';
    field.appendChild(s);
  }
  btn.style.display='none';
}
btn.addEventListener('click',bloom);
</script>
</body>
</html>
